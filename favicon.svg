<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="181.65" height="209.76"><svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="181.65" height="209.76"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 181.65 209.76" width="181.65" height="209.76">
  <defs>
    <linearGradient id="azureGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#005A9E;stop-opacity:1"></stop>
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#50E6FF;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#0078D4;stop-opacity:1"></stop>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"></feDropShadow>
    </filter>
  </defs>

  <!-- Hex background with border -->
  <polygon points="90.82,1 180.65,52.94 180.65,156.82 90.82,208.76 1,156.82 1,52.94" fill="url(#azureGradient)" stroke="#005A9E" stroke-width="2"></polygon>

  <!-- Inner hex highlight -->
  <polygon points="90.82,12 168.65,57.94 168.65,151.82 90.82,197.76 13,151.82 13,57.94" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"></polygon>

  <!-- Azure AI Foundry inspired icon - stylized neural network / AI symbol -->
  <g transform="translate(90.82, 85)" filter="url(#shadow)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" opacity="0.95"></circle>
    <circle cx="0" cy="0" r="8" fill="url(#iconGradient)"></circle>

    <!-- Outer nodes -->
    <circle cx="-35" cy="-20" r="7" fill="#FFFFFF" opacity="0.9"></circle>
    <circle cx="35" cy="-20" r="7" fill="#FFFFFF" opacity="0.9"></circle>
    <circle cx="-35" cy="20" r="7" fill="#FFFFFF" opacity="0.9"></circle>
    <circle cx="35" cy="20" r="7" fill="#FFFFFF" opacity="0.9"></circle>
    <circle cx="0" cy="-40" r="7" fill="#FFFFFF" opacity="0.9"></circle>

    <!-- Connection lines -->
    <line x1="0" y1="0" x2="-35" y2="-20" stroke="#FFFFFF" stroke-width="2" opacity="0.6"></line>
    <line x1="0" y1="0" x2="35" y2="-20" stroke="#FFFFFF" stroke-width="2" opacity="0.6"></line>
    <line x1="0" y1="0" x2="-35" y2="20" stroke="#FFFFFF" stroke-width="2" opacity="0.6"></line>
    <line x1="0" y1="0" x2="35" y2="20" stroke="#FFFFFF" stroke-width="2" opacity="0.6"></line>
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#FFFFFF" stroke-width="2" opacity="0.6"></line>

    <!-- Outer connections -->
    <line x1="-35" y1="-20" x2="0" y2="-40" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"></line>
    <line x1="35" y1="-20" x2="0" y2="-40" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"></line>
    <line x1="-35" y1="-20" x2="-35" y2="20" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"></line>
    <line x1="35" y1="-20" x2="35" y2="20" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"></line>
  </g>

  <!-- Package name "foundryR" -->
  <text x="90.82" y="165" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">foundryR</text>

  <!-- Subtle tagline -->
  <text x="90.82" y="183" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="0.5">Azure AI Foundry</text>
</svg></svg><style>@media (prefers-color-scheme: light) { :root { filter: none; } }
@media (prefers-color-scheme: dark) { :root { filter: none; } }
</style></svg>