name: Build CRAN source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FOUNDRYR_RUN_LIVE_TESTS: "false"
      FOUNDRY_RECORD_DOCS: ""

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Build CRAN source tarball
        run: R CMD build . --compact-vignettes=gs+qpdf

      - name: Audit source archive and record checksum
        run: |
          python .github/scripts/test-audit-source.py
          python .github/scripts/audit-source.py foundryR_0.1.0.tar.gz
          git rev-parse HEAD > SOURCE_COMMIT.txt

      - name: Upload CRAN source tarball
        uses: actions/upload-artifact@v4
        with:
          name: foundryR-cran-source
          path: |
            foundryR_*.tar.gz
            foundryR_*.sha256
            source-audit.json
            SOURCE_COMMIT.txt
          if-no-files-found: error

  check-source:
    needs: build
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: release}
          - {os: macos-latest, r: release}
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: devel}
          - {os: ubuntu-latest, r: oldrel-1}
    name: Source tarball (${{ matrix.config.os }}, ${{ matrix.config.r }})
    env:
      FOUNDRYR_RUN_LIVE_TESTS: "false"
      FOUNDRY_RECORD_DOCS: ""
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'

      - name: Install HTML manual validator
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tidy

      - uses: actions/download-artifact@v4
        with:
          name: foundryR-cran-source
          path: cran-source

      - name: Verify the downloaded source archive
        run: python .github/scripts/audit-source.py cran-source/foundryR_0.1.0.tar.gz

      - name: Check the exact source tarball
        run: |
          args <- c("--as-cran", "--run-donttest", "--timings")
          if (!identical(Sys.getenv("CHECK_MANUAL"), "true")) {
            args <- c(args, "--no-manual")
          }
          rcmdcheck::rcmdcheck(
            "cran-source/foundryR_0.1.0.tar.gz",
            args = args,
            check_dir = "cran-check",
            error_on = "warning"
          )
        shell: Rscript {0}
        env:
          CHECK_MANUAL: ${{ matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release' }}

      - name: Upload source check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cran-check-${{ runner.os }}-${{ matrix.config.r }}
          path: |
            cran-check/**/00check.log
            cran-check/**/00install.out
            cran-check/**/*-Ex.timings
            cran-check/**/tests/*.Rout*
            cran-source/*.sha256
          if-no-files-found: warn
