name: Build CRAN source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Build CRAN source tarball
        run: R CMD build . --compact-vignettes=gs+qpdf

      - name: Upload CRAN source tarball
        uses: actions/upload-artifact@v4
        with:
          name: foundryR-cran-source
          path: foundryR_*.tar.gz
          if-no-files-found: error
