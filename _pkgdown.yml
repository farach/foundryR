url: https://farach.github.io/foundryR/

template:
  package: foundryR


  bootstrap: 5
  bootswatch: cosmo
  light-switch: true
  bslib:
    primary: "#0078D4"
    border-radius: 0.25rem
    btn-border-radius: 0.25rem
  includes:
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  assets: pkgdown

home:
  title: foundryR - Tidy Azure AI Foundry workflows
  description: >
    A tibble-native R interface to Microsoft Azure AI Foundry for Content
    Safety, Responses API workflows, strict extraction, embeddings, batch jobs,
    files, audio, media helpers, and chat completions.
  sidebar:
    structure: [links, license, community, citation, authors, dev]
    components:
      links:
        title: Links
        text: |
          - [Azure AI Foundry](https://azure.microsoft.com/en-us/products/ai-foundry/)
          - [Azure OpenAI Documentation](https://learn.microsoft.com/azure/ai-services/openai/)
          - [Azure AI Content Safety](https://azure.microsoft.com/products/ai-services/ai-content-safety/)

navbar:
  bg: primary
  type: dark
  structure:
    left: [intro, reference, articles, news]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get Started
      href: articles/getting-started.html
    articles:
      text: Articles
      menu:
        - text: "Core"
        - text: Getting Started
          href: articles/getting-started.html
        - text: foundryR vs ellmer
          href: articles/foundryr-vs-ellmer.html
        - text: Responses API
          href: articles/responses-api.html
        - text: Text Embeddings
          href: articles/embeddings.html
        - text: "---"
        - text: "Responsible AI"
        - text: Content Safety
          href: articles/content-safety.html
        - text: "---"
        - text: "Research Workflows"
        - text: Annotation Workflow
          href: articles/annotation-workflow.html
        - text: Files and Batch API
          href: articles/files-batches.html
        - text: tidymodels Integration
          href: articles/tidymodels.html
        - text: "---"
        - text: "Advanced Topics"
        - text: Audio Workflows
          href: articles/audio.html
        - text: Image and Video Generation
          href: articles/media-generation.html
        - text: "---"
        - text: "Integrations"
        - text: onet2r Integration
          href: articles/onet2r-integration.html
    github:
      icon: fa-github
      href: https://github.com/farach/foundryR
      aria-label: GitHub repository

reference:
  - title: Setup and configuration
    desc: >
      Configure your Azure AI Foundry credentials and verify your setup.
      These functions manage authentication for all API calls.
    contents:
      - foundry_check_setup
      - foundry_set_key
      - foundry_set_token
      - foundry_set_token_provider
      - foundry_token_azure_cli
      - foundry_token_azure_identity
      - foundry_set_endpoint
      - foundry_get_endpoint
      - foundry_set_project_endpoint
      - foundry_get_project_endpoint
      - foundry_set_speech_endpoint
      - foundry_set_speech_key

  - title: Content Safety
    desc: >
      Azure AI Content Safety features for responsible AI pipelines.
      Moderate content, detect hallucinations, and protect against prompt
      injection.
    contents:
      - foundry_moderate
      - foundry_moderate_image
      - foundry_moderate_multimodal
      - foundry_protected_material
      - foundry_protected_code
      - foundry_blocklists
      - foundry_blocklist_create
      - foundry_blocklist_get
      - foundry_blocklist_delete
      - foundry_blocklist_items
      - foundry_blocklist_add_items
      - foundry_blocklist_remove_items
      - foundry_groundedness
      - foundry_llm_resource
      - foundry_shield
      - foundry_task_adherence
      - foundry_agent_tool
      - foundry_agent_tool_call
      - foundry_agent_message
      - foundry_set_content_safety_key
      - foundry_set_content_safety_endpoint

  - title: Responses API and extraction
    desc: >
      Use Microsoft Foundry's newer v1 Responses API for stateful turns,
      user-defined tools, schema-constrained extraction, and web-grounded
      answers.
    contents:
      - foundry_response
      - foundry_agent
      - foundry_tool
      - foundry_response_retrieve
      - foundry_response_delete
      - foundry_response_cancel
      - foundry_response_input_items
      - foundry_extract
      - foundry_web_search
      - foundry_schema
      - schema_string
      - schema_enum
      - schema_number
      - schema_integer
      - schema_boolean
      - type_boolean
      - type_enum
      - type_number
      - type_string
      - schema_array
      - schema_object
      - as_foundry_schema

  - title: Agents
    desc: >
      Create, list, and manage named, versioned prompt agents on the Foundry
      Agent Service, then run a stored agent by name through
      [foundry_response()] with `agent_reference`.
    contents:
      - foundry_agent_create
      - foundry_agents
      - foundry_agent_get
      - foundry_agent_delete
      - foundry_agent_versions
      - foundry_agent_reference

  - title: Conversations and vector stores
    desc: >
      Manage server-side Responses API conversations and Azure-hosted vector
      stores for shared retrieval workflows.
    contents:
      - foundry_conversation_create
      - foundry_conversations
      - foundry_conversation_get
      - foundry_conversation_update
      - foundry_conversation_delete
      - foundry_conversation_items
      - foundry_conversation_items_add
      - foundry_vector_store_create
      - foundry_vector_stores
      - foundry_vector_store_get
      - foundry_vector_store_modify
      - foundry_vector_store_delete
      - foundry_vector_store_files
      - foundry_vector_store_file_add
      - foundry_vector_store_file_remove
      - foundry_vector_store_file_batch
      - foundry_vector_search
      - foundry_tool_file_search

  - title: Text embeddings
    desc: >
      Generate vector embeddings for semantic search, clustering, and
      machine learning. Includes batch processing and similarity computation.
    contents:
      - foundry_embed
      - foundry_embed_batch
      - foundry_similarity

  - title: Files and Batch API
    desc: >
      Upload files, prepare JSONL request files, and manage asynchronous batch
      jobs for large-scale annotation, extraction, and classification.
    contents:
      - foundry_file_upload
      - foundry_files
      - foundry_file_get
      - foundry_file_delete
      - foundry_file_download
      - foundry_batch_requests
      - foundry_batch_create
      - foundry_batches
      - foundry_batch_get
      - foundry_batch_cancel
      - foundry_batch_wait
      - foundry_batch_results
      - foundry_extract_batch
      - foundry_usage

  - title: Evaluations
    desc: >
      Run Azure AI Foundry cloud evaluations. Define graders (string check,
      text similarity, model-graded labels and scores, and Azure built-in
      evaluators), create evaluations, and inspect per-row grader results as
      tibbles.
    contents:
      - foundry_grader_string_check
      - foundry_grader_text_similarity
      - foundry_grader_label_model
      - foundry_grader_score_model
      - foundry_grader_azure_ai
      - foundry_eval_item
      - foundry_eval_data_config
      - foundry_eval_run_data
      - foundry_eval_create
      - foundry_evals
      - foundry_eval_get
      - foundry_eval_delete
      - foundry_eval_run_create
      - foundry_eval_runs
      - foundry_eval_run_get
      - foundry_eval_run_cancel
      - foundry_eval_run_output_items

  - title: Validation and provenance
    desc: >
      Validate LLM annotation against human labels, measure repeated-extraction
      consistency, and record reproducibility metadata.
    contents:
      - foundry_agreement
      - foundry_consistency
      - foundry_codebook
      - codebook_diff
      - foundry_provenance

  - title: tidymodels integration
    desc: >
      Add Foundry text embeddings to tidymodels recipes.
    contents:
      - step_foundry_embed
      - bake.step_foundry_embed
      - prep.step_foundry_embed
      - print.step_foundry_embed
      - required_pkgs.step_foundry_embed
      - foundry_cache_clear

  - title: Chat completions
    desc: >
      Send chat-completion requests to Azure AI Foundry deployments.
    contents:
      - foundry_chat

  - title: Audio and speech
    desc: >
      Transcribe and translate research audio, including MAI-Transcribe models
      through LLM Speech, and synthesize text-to-speech audio files.
    contents:
      - foundry_transcribe
      - foundry_translate_audio
      - foundry_speak

  - title: Experimental media
    desc: >
      Generate and edit images with v1 preview image models, and manage preview
      video generation jobs.
    contents:
      - foundry_image
      - foundry_image_edit
      - foundry_save_image
      - foundry_set_image_endpoint
      - foundry_set_image_key
      - foundry_video_job_create
      - foundry_video_jobs
      - foundry_video_job_get
      - foundry_video_job_delete
      - foundry_video_get
      - foundry_video_download

  - title: Model discovery
    desc: >
      Explore available model deployments in your Azure AI Foundry resource.
    contents:
      - foundry_models

articles:
  - title: Core
    navbar: ~
    contents:
      - getting-started
      - foundryr-vs-ellmer
      - responses-api
      - embeddings

  - title: Responsible AI
    navbar: ~
    contents:
      - content-safety

  - title: Research Workflows
    navbar: ~
    contents:
      - annotation-workflow
      - files-batches
      - tidymodels

  - title: Advanced Topics
    navbar: ~
    contents:
      - audio
      - media-generation

  - title: Integrations
    navbar: ~
    contents:
      - articles/onet2r-integration

